# NASA and ESA Data Projects · Mars Data: automatic update · © 2026 Malcolm Syme · mcsyme11@gmail.com
#
# Twice a week, checks NASA's Planetary Data System for new or replaced Curiosity REMS and Perseverance MEDA files,
# and ESA's archive for Mars Express profiles, processes only those
# (mars-data/analysis/update.py, cleaning rules in CLEANING.md), checks the results (validate.py), rebuilds the page
# files and commits them. Nothing is saved if a check fails. A GitHub issue is opened when new data is added or when
# NASA's list of re-released files changes; GitHub emails issues to the repository's owner. A failed run is reported by
# the daily Data health check (since Nov 14, 2026), like every other data job.
# Follows the data-job standard in docs/DATA-UPDATES.md: the last step (dev/datajob.py) checks the files before they are
# saved, records each step's state in shared/data/status/mars-data.json and commits with the standard message.
# Decided Nov 11, 2026 (docs/PROJECT-NOTES.md): twice a week to start, weekly once stable.

name: Mars data

on:
  schedule:
    - cron: '23 9 * * 1,4'    # Mondays and Thursdays, 09:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

concurrency:
  group: mars-data
  cancel-in-progress: false

jobs:
  # Decided Nov 20, 2026: GitHub's own schedule stays as the backup of the outside clock, but its late start of a slot
  # that has already run successfully is skipped (dev/datajob.py --gate), so a source is not asked twice.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: dev
      - name: Skip GitHub's late start of a slot that already ran
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 dev/datajob.py --gate mars-data '${{ github.event.schedule }}'

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pandas
        run: pip install pandas==2.2.3
      - name: Count the sols saved so far
        run: |
          echo "PREV_SOLS=$(( $(wc -l < mars-data/data/rems/sols.csv) - 1 ))" >> "$GITHUB_ENV"
          if [ -f mars-data/data/meda/sols.csv ]; then echo "PREV_MEDA_SOLS=$(( $(wc -l < mars-data/data/meda/sols.csv) - 1 ))" >> "$GITHUB_ENV"; fi
      - name: Look for new data in NASA's archive and process it
        id: archive
        working-directory: mars-data/analysis
        run: python3 update.py
      - name: Check the results before saving
        id: validation
        working-directory: mars-data/analysis
        run: python3 validate.py
      - name: Rebuild the page files
        id: page
        run: python3 mars-data/analysis/make_page_data.py
      # The data is saved only when all three steps succeeded; the status is recorded in every case.
      - name: Check, record and commit
        if: always()
        run: >-
          python3 dev/datajob.py --job mars-data
          --message "Mars data: archive checked $(date -u +%Y-%m-%d)"
          --paths ${{ (steps.archive.outcome == 'success' && steps.validation.outcome == 'success' && steps.page.outcome == 'success') && 'mars-data/data' || '' }}
          --source archive=${{ steps.archive.outcome }}
          --source validation=${{ steps.validation.outcome }}
          --source page-files=${{ steps.page.outcome }}
      - name: Email notice (new data or a change to review)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="$RUNNER_TEMP/mars_update_notice.md"
          if [ -f "$f" ]; then
            gh issue create --title "Mars data: new data $(date -u +%Y-%m-%d)" --body-file "$f"
          fi
